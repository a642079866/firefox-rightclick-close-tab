// tabutils.cfg —— 由 autoconfig.js 加载，运行在浏览器 chrome 权限下
// 功能：标签栏上右键单击 = 关闭该标签；按住 Shift 右键 = 保留原生菜单
// 开关：about:config 里 tabutils.rightClickCloseTab 设为 false 即可关闭
try {
  const { classes: Cc, interfaces: Ci } = Components;
  const LOG_PATH = "/tmp/firefox-tabutils.log";

  function log(msg) {
    try {
      const f = Cc["@mozilla.org/file/local;1"].createInstance(Ci.nsIFile);
      f.initWithPath(LOG_PATH);
      const s = Cc["@mozilla.org/network/file-output-stream;1"].createInstance(Ci.nsIFileOutputStream);
      s.init(f, 0x02 | 0x08 | 0x10, 0o644, 0);
      const line = new Date().toISOString() + "  " + msg + "\n";
      s.write(line, line.length);
      s.close();
    } catch (e) {}
  }

  const prefs = Cc["@mozilla.org/preferences-service;1"].getService(Ci.nsIPrefBranch);
  function enabled() {
    try { return prefs.getBoolPref("tabutils.rightClickCloseTab", true); }
    catch (e) { return true; }
  }

  function findTab(node) {
    while (node && node.localName !== "tab") node = node.parentNode;
    return node;
  }

  function bind(win) {
    try {
      const tabs = win.document.getElementById("tabbrowser-tabs");
      if (!tabs) { log("skip: no #tabbrowser-tabs"); return; }
      if (tabs.__tabutilsBound) { return; }
      tabs.__tabutilsBound = true;

      tabs.addEventListener("contextmenu", function (event) {
        if (event.shiftKey || !enabled()) return;
        const tab = findTab(event.target);
        if (!tab) return;
        event.preventDefault();
        event.stopPropagation();
        try {
          win.gBrowser.removeTab(tab);
          log("closed a tab");
        } catch (e) { log("removeTab failed: " + e); }
      }, true);

      log("bound ok (window)");
    } catch (e) { log("bind failed: " + e); }
  }

  const observer = {
    observe: function (subject, topic) {
      if (topic === "browser-delayed-startup-finished") bind(subject);
    },
    QueryInterface: ChromeUtils.generateQI(["nsIObserver"]),
  };
  Cc["@mozilla.org/observer-service;1"].getService(Ci.nsIObserverService)
    .addObserver(observer, "browser-delayed-startup-finished");

  log("autoconfig loaded");
} catch (e) {
  try { dump("tabutils autoconfig error: " + e + "\n"); } catch (e2) {}
}
